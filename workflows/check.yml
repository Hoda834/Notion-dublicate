name: Colour duplicate Notion names

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check duplicates and colour names
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python check.py
